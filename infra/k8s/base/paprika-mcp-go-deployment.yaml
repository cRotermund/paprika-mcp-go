apiVersion: apps/v1
kind: Deployment
metadata:
  name: paprika-mcp-go
  labels:
    app: paprika-mcp-go
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paprika-mcp-go
  template:
    metadata:
      labels:
        app: paprika-mcp-go
    spec:
      containers:
        - name: paprika-mcp-go
          image: paprika-mcp-go:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
          env:
            - name: PORT
              value: "8080"
            - name: PAPRIKA_WRITES_ENABLED
              value: "false"
            - name: PAPRIKA_REQUESTS_PER_MINUTE
              value: "50"
            - name: PAPRIKA_REQUEST_BURST
              value: "4"
            - name: INDEX_STORE
              value: "none"
            - name: MCP_TOKEN_SHA256
              valueFrom:
                secretKeyRef:
                  name: paprika-mcp-go
                  key: MCP_TOKEN_SHA256
            - name: PAPRIKA_EMAIL
              valueFrom:
                secretKeyRef:
                  name: paprika-mcp-go
                  key: PAPRIKA_EMAIL
            - name: PAPRIKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paprika-mcp-go
                  key: PAPRIKA_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
