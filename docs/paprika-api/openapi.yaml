              required: [data]
              properties:
                data:
                  description: A part named `data`, holding a gzip-compressed JSON array of `CategoryUpload` objects.
                  type: array
                  items:
                    $ref: '#/components/schemas/CategoryUpload'
            encoding:
              data:
                contentType: application/gzip
      responses:
        '200':
          $ref: '#/components/responses/WriteResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/sync/meals/:
    get:
      tags: [Meal plans]
      operationId: listMeals
      summary: List all planned meals
      description: No date filter is known, so filter locally.
      x-evidence: live
