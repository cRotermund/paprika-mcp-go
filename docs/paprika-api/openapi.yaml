openapi: 3.1.0
info:
  title: Paprika Cloud Sync API (Unofficial)
  version: 2026-11-01
  license:
    name: MIT
    identifier: MIT
  description: |
    Unofficial reference for the HTTP API that Paprika Recipe Manager 3 uses to sync
    with its cloud service. Paprika does not publish this API, and it can change without
    notice. This project is not affiliated with Hindsight Labs, LLC.

    Baseline: Paprika for Windows 3.3.1. The [prose docs](README.md) explain the sync
    model, risks, and open questions in more depth.

    ## Evidence

    Each operation has an `x-evidence` value showing how it was established:

    - `live`: verified against the real API by this project.
    - `capture`: seen in real traffic from the Windows client.
    - `client`: seen in the Windows client's behavior, but not observed on the wire.
    - `kappari`: reported by the kappari project.
    - `inferred`: reasoned from other evidence.

    **This project's own code has not written to the API yet.** Every write format below
    comes from the official client.

    ## Writes

    A write is a `multipart/form-data` POST with one part named `data`. Its bytes are
    **gzip-compressed JSON**, so the `data` field each write operation shows is its shape
    **before compression**. The client sends this header on the part, with no `Content-Type`:

    `Content-Disposition: form-data; name=data; filename=file; filename*=utf-8''file`

    Whether the server accepts Go's standard multipart format is untested.

    Bulk routes take an array of changed objects, and add or update them by `uid`. They
    do not replace the resource. Always send the whole object, and call `sync/notify/`
    after writing.

    In upload schemas, `required` lists what the official client always sends. What the
    server actually requires is unknown. In read schemas, it lists what was always present
    in sampled responses.

    ## Errors

    Errors use an `error` object, **sometimes with HTTP 200.** Always check for it. The
    official client also treats HTTP 503 as a special case.
servers:
  - url: https://www.paprikaapp.com/api
security:
  - bearerAuth: []
tags:
  - name: Account
    description: Log in to get a token.
  - name: Sync
    description: Change counters and notifications.
  - name: Recipes
    description: Recipes and their categories.
  - name: Meal plans
    description: Calendar meals and their types.
  - name: Grocery lists
    description: Lists, items, aisles, and remembered ingredients.
  - name: Menus
    description: Reusable meal templates. Out of scope for this project's first release.
  - name: Other
    description: Resources this project does not plan to use yet.
paths:
  /v1/account/login/:
    post:
      tags: [Account]
      operationId: login
      summary: Log in with email and password
      description: |
        The recommended login. No license data is needed, and the token works on v2 sync
        routes. A wrong password returns HTTP 200 with an `error` object.
      x-evidence: live
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: A token, or an error object.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResult'
                  - $ref: '#/components/schemas/ErrorResult'
              examples:
                success:
                  value:
                    result:
                      token: example-token
                wrongPassword:
                  value:
                    error:
                      message: Incorrect password.
                      code: 0
  /v2/account/login/:
    post:
      tags: [Account]
      operationId: loginWithLicense
      summary: Log in with a license
      deprecated: true
      description: |
        Used by the desktop client. Kappari reports that it rejects password-only logins from
        non-mobile clients. Marked deprecated here because this project should use the v1
        login instead; Paprika has not deprecated it.
      x-evidence: kappari
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [email, password, data, signature]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                data:
                  type: string
                  description: License data as a JSON string.
                signature:
                  type: string
                  description: Base64-encoded license signature.
      responses:
        '200':
          description: A token, or an error object.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResult'
                  - $ref: '#/components/schemas/ErrorResult'
  /v2/sync/status/:
    get:
      tags: [Sync]
      operationId: getSyncStatus
      summary: Get change counters
      description: |
        Maps each resource name to a counter. Counters count changes, not objects, and rise
        by one per written object. Compare them to skip unnecessary downloads.

        `cookbooks`, `pantrylocations`, and `recipesearches` have counters, but their
        `sync/{name}/` routes return 404.
      x-evidence: live
      responses:
        '200':
          description: Counters by resource name.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    additionalProperties:
                      type: integer
              example:
                result:
                  recipes: 120
                  meals: 45
                  groceries: 300
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/sync/notify/:
    post:
      tags: [Sync]
      operationId: notifyDevices
      summary: Tell other devices to sync
      description: Has no request body. The client calls this after a sync that uploaded something.
      x-evidence: capture
      responses:
        '200':
          $ref: '#/components/responses/WriteResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/sync/recipes/:
    get:
      tags: [Recipes]
      operationId: listRecipes
      summary: List recipe IDs and hashes
      description: |
        Returns only `uid` and `hash`, so fetch full recipes individually. Includes trashed
        recipes, but not permanently deleted ones.
      x-evidence: live
      responses:
        '200':
          description: A summary of every recipe.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/sync/recipe/{uid}/:
    parameters:
      - name: uid
        in: path
        required: true
        description: The recipe's `uid`.
        schema:
          $ref: '#/components/schemas/Uid'
    get:
      tags: [Recipes]
      operationId: getRecipe
      summary: Get one recipe
      x-evidence: live
      responses:
        '200':
          description: The full recipe.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Recipes]
      operationId: saveRecipe
      summary: Create, update, trash, or delete a recipe
      description: |
        The same request covers every change. Send the whole recipe, with a new `hash` every
        time, or other devices may not notice the change.

        - **Create:** choose a new uppercase UUID as the `uid`.
        - **Trash:** set `in_trash: true`.
        - **Permanently delete:** set `deleted: true`. Assume this cannot be undone.

        A photo adds a second part named `photo_upload`, which is not documented here.
      x-evidence: capture
      requestBody:
        required: true
        description: A part named `data`, holding one gzip-compressed JSON `RecipeUpload` object.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  description: A part named `data`, holding one gzip-compressed JSON `RecipeUpload` object.
                  $ref: '#/components/schemas/RecipeUpload'
            encoding:
              data:
                contentType: application/gzip
      responses:
        '200':
          $ref: '#/components/responses/WriteResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/sync/categories/:
    get:
      tags: [Recipes]
      operationId: listCategories
      summary: List recipe categories
      x-evidence: live
      responses:
        '200':
          description: All categories. They nest through `parent_uid`.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Recipes]
      operationId: saveCategories
      summary: Add or update categories
      x-evidence: client
      requestBody:
        required: true
        description: A part named `data`, holding a gzip-compressed JSON array of `CategoryUpload` objects.
        content:
