        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Meal plans]
      operationId: saveMeals
      summary: Add, move, or delete meals
      description: |
        Send the whole meal each time. Change `date` to move it, or set `deleted: true` to
        delete it. Use only `recipe_uid` and `type_uid` values that exist, because other
        devices may silently change invalid ones.
      x-evidence: capture
      requestBody:
        required: true
        description: A part named `data`, holding a gzip-compressed JSON array of `MealUpload` objects.
