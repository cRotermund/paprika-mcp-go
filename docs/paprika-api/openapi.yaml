components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The token from the login route.
  responses:
    WriteResult:
      description: The write was accepted, or an error object.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [result]
                properties:
                  result:
                    const: true
              - $ref: '#/components/schemas/ErrorResult'
          example:
            result: true
    UnknownList:
      description: An array of objects with unknown fields.
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                type: array
                items:
                  type: object
    Unauthorized:
      description: The token is missing, invalid, or possibly expired. Log in again and retry once.
    NotFound:
      description: Unknown route or object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            error:
              message: Not found.
              code: 0
  schemas:
    Uid:
      type: string
      description: |
        An opaque ID. Most are uppercase UUIDs, but live data also has uppercase 64-character hex values
        and longer strings. Never parse one. Clients generate new ones as uppercase UUIDs.
      example: 11111111-2222-4333-8444-555555555555
    Hash:
      type: string
      description: |
        A change marker, not a content checksum. Compare hashes as opaque strings. The Windows
        client generates a new one for each write: the SHA-256 of a random UUID, as uppercase
        hex. Live recipe hashes are mostly lowercase, with some uppercase.
      pattern: ^[0-9A-Fa-f]{64}$
    Timestamp:
      type: string
      description: A date and time with no time zone, as `YYYY-MM-DD HH:MM:SS`.
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: '2030-01-15 00:00:00'
    Deleted:
      type: boolean
      description: |
        Upload-only. `true` deletes the object, and the server stops listing it. Assume this
        cannot be undone.
    LoginResult:
      type: object
      required: [result]
      properties:
        result:
          type: object
          required: [token]
          properties:
            token:
              type: string
    ErrorResult:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: integer
              description: Only `0` has been observed.
    RecipeSummary:
      type: object
      required: [uid, hash]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        hash:
          $ref: '#/components/schemas/Hash'
    RecipeUploadFields:
      type: object
      description: The fields Paprika for Windows 3.3.1 uploads, apart from `deleted`.
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        created:
          $ref: '#/components/schemas/Timestamp'
        hash:
          $ref: '#/components/schemas/Hash'
        name:
          type: string
        description:
          type: string
        ingredients:
          type: string
          description: Multiline text. The Windows client writes line breaks as `\r\n`.
        directions:
          type: string
          description: Multiline text.
        notes:
          type: string
        nutritional_info:
          type: string
        prep_time:
          type: string
          description: Free text.
        cook_time:
          type: string
          description: Free text.
        total_time:
          type: string
          description: Free text.
        difficulty:
          type: string
          description: Free text.
        servings:
          type: string
          description: Free text.
        rating:
          type: integer
          minimum: 0
          maximum: 5
          description: 0 means unrated.
        scale:
          description: Always null in samples, so its real type is unknown.
        source:
          type: string
        source_url:
          type: string
        on_favorites:
          type: boolean
        is_pinned:
          type: boolean
        in_trash:
          type: boolean
          description: The recoverable app trash.
        photo:
          type: [string, 'null']
          description: Preserve on update.
        photo_large:
          type: [string, 'null']
          description: Preserve on update.
        photo_hash:
          type: [string, 'null']
          description: Preserve on update.
        image_url:
          type: [string, 'null']
          description: Preserve on update.
        categories:
          type: array
          description: Category `uid` values. Send the complete list, because a partial one removes the others.
          items:
            $ref: '#/components/schemas/Uid'
    Recipe:
      description: |
        A full recipe as returned by the API. Round-trip fields this schema does not name, since
        the server may add more.
      allOf:
        - $ref: '#/components/schemas/RecipeUploadFields'
        - type: object
          properties:
            photo_url:
              type: [string, 'null']
              description: Server-provided download link. Not uploaded by 3.3.1.
            on_grocery_list:
              type: boolean
              description: Not uploaded by 3.3.1.
            prep_minutes:
              description: Always null in samples. Newer than 3.3.1 (inferred).
            cook_minutes:
              description: Always null in samples. Newer than 3.3.1 (inferred).
            total_minutes:
              description: Always null in samples. Newer than 3.3.1 (inferred).
            servings_min:
              description: Always null in samples. Newer than 3.3.1 (inferred).
            servings_max:
              description: Always null in samples. Newer than 3.3.1 (inferred).
            nutrition:
              description: Always null in samples. Newer than 3.3.1 (inferred).
            metadata_version:
              description: Always null in samples. Newer than 3.3.1 (inferred).
            cookbook_uid:
              description: Always null in samples. Newer than 3.3.1 (inferred).
    RecipeUpload:
      description: The recipe object as uploaded by the Windows client.
      allOf:
        - $ref: '#/components/schemas/RecipeUploadFields'
        - type: object
          required: [uid, hash, deleted, name, created]
          properties:
            deleted:
              $ref: '#/components/schemas/Deleted'
    Category:
      type: object
      required: [uid, name, order_flag]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        name:
          type: string
        order_flag:
          type: integer
        parent_uid:
          type: [string, 'null']
          description: The parent category's `uid`.
        cookbook_uid:
          description: Always null in samples.
    CategoryUpload:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            deleted:
              $ref: '#/components/schemas/Deleted'
    MealFields:
      type: object
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        order_flag:
          type: integer
          description: Position within a day.
        name:
          type: string
          description: Display name.
        date:
          $ref: '#/components/schemas/Timestamp'
        type:
          type: integer
          description: Older fixed meal type, matching `original_type` on a meal type.
        recipe_uid:
          type: [string, 'null']
          description: The linked recipe, or null when there is none.
        type_uid:
          type: string
          description: The meal type's `uid`.
    Meal:
      allOf:
        - $ref: '#/components/schemas/MealFields'
        - type: object
          properties:
            is_ingredient:
              type: boolean
              description: Not uploaded by 3.3.1.
            scale:
              description: Always null in samples. Not uploaded by 3.3.1.
    MealUpload:
      allOf:
        - $ref: '#/components/schemas/MealFields'
        - type: object
          required: [uid, deleted, order_flag, name, date, type, recipe_uid, type_uid]
          properties:
            deleted:
              $ref: '#/components/schemas/Deleted'
      example:
        uid: AAAAAAAA-1111-4222-8333-444444444444
        deleted: false
        order_flag: 0
        name: Vegetable Soup
        date: '2030-01-15 00:00:00'
        type: 2
        recipe_uid: 11111111-2222-4333-8444-555555555555
        type_uid: BBBBBBBB1111422283334444444444BBBBBBBB1111422283334444444444BBBB
    MealType:
      type: object
      required: [uid, name, order_flag, original_type]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        name:
          type: string
        order_flag:
          type: integer
        original_type:
          type: integer
          description: 0 to 3 were seen. Their meanings are unconfirmed, so use `name` instead.
        color:
          type: string
          description: A 7-character value, likely a hex color (inferred).
        export_time:
          type: integer
          description: Likely seconds after midnight (inferred).
        export_all_day:
          type: boolean
    MealTypeUpload:
      allOf:
        - $ref: '#/components/schemas/MealType'
        - type: object
          properties:
            deleted:
              $ref: '#/components/schemas/Deleted'
    GroceryItemFields:
      type: object
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        name:
          type: string
          description: Display text.
        order_flag:
          type: integer
        purchased:
          type: boolean
          description: Checked off.
        recipe:
          type: [string, 'null']
          description: Source recipe name (inferred). Always null in samples.
        aisle:
          type: string
          description: Aisle name.
        ingredient:
          type: string
          description: Parsed ingredient. The client sent the full text here for a new item.
        instruction:
          type: string
          description: Parsed preparation note. Can be empty.
        quantity:
          type: string
          description: Parsed amount. Can be empty.
        separate:
          type: boolean
          description: Meaning unconfirmed.
        aisle_uid:
          type: string
          description: The aisle's `uid`.
        list_uid:
          type: string
          description: The grocery list's `uid`. Must exist.
    GroceryItem:
      allOf:
        - $ref: '#/components/schemas/GroceryItemFields'
        - type: object
          properties:
            recipe_uid:
              description: Always null in samples. Not uploaded by 3.3.1.
    GroceryItemUpload:
      allOf:
        - $ref: '#/components/schemas/GroceryItemFields'
        - type: object
          required: [uid, deleted, name, order_flag, purchased, recipe, aisle, ingredient, instruction, quantity, separate, aisle_uid, list_uid]
          properties:
            deleted:
              $ref: '#/components/schemas/Deleted'
      example:
        uid: CCCCCCCC-1111-4222-8333-444444444444
        deleted: false
        name: carrots
        order_flag: 0
        purchased: false
        recipe: null
        aisle: Produce
        ingredient: carrots
        instruction: ''
        quantity: ''
        separate: false
        aisle_uid: DDDDDDDD1111422283334444444444DDDDDDDD1111422283334444444444DDDD
        list_uid: EEEEEEEE-1111-4222-8333-444444444444
    GroceryList:
      type: object
      required: [uid, name, order_flag, is_default, reminders_list]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        name:
          type: string
        order_flag:
          type: integer
        is_default:
          type: boolean
        reminders_list:
          type: string
          description: Can be empty. A list created in the client sent `Paprika`.
    GroceryListUpload:
      allOf:
        - $ref: '#/components/schemas/GroceryList'
        - type: object
          properties:
            deleted:
              $ref: '#/components/schemas/Deleted'
    GroceryAisle:
      type: object
      required: [uid, name, order_flag]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        name:
          type: string
        order_flag:
          type: integer
    GroceryAisleUpload:
      allOf:
        - $ref: '#/components/schemas/GroceryAisle'
        - type: object
          properties:
            deleted:
              $ref: '#/components/schemas/Deleted'
    GroceryIngredient:
      type: object
