        Send the whole item each time. Set `purchased: true` to check it off, or
        `deleted: true` to delete it.

        **Verify that `list_uid` exists first.** Other devices may mark an item with an unknown
        list as deleted.
      x-evidence: capture
      requestBody:
        required: true
        description: A part named `data`, holding a gzip-compressed JSON array of `GroceryItemUpload` objects.
